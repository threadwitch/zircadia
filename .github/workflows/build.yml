---
name: Build container image
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_DESC: "Opinionated niri + bootc image with some tools I wanted, and Steam."
  IMAGE_KEYWORDS: "bootc,niri"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/255999959?s=400&v=4"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

jobs:
  build_push:
    name: Build and push ${{ matrix.image_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "amd64"
            image_name: "zircadia"
            # renovate: datasource=docker depName=ghcr.io/zirconium-dev/zirconium
            base_image: "ghcr.io/zirconium-dev/zirconium:latest@sha256:bb79ea40ccb9f6bd99376de2b2dcbf2ae9563bec711c293349ed49265500fb6a"
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    env:
      BASE_IMAGE: ${{ matrix.base_image }}
      IMAGE_NAME: ${{ matrix.image_name }}
    steps:
      - name: Mount BTRFS for podman storage
        if: ${{ matrix.platform != 'arm64' }}
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Build image
        id: build
        env:
          BASE_IMAGE: ${{ env.BASE_IMAGE }}
        # RUN bind mounts from the ctx stage are not reliably included in older
        # Podman/Buildah cache keys. Disable layer reuse so build_files changes
        # cannot silently produce a stale image.
        run: sudo podman build --no-cache "--build-arg=BASE_IMAGE=${BASE_IMAGE}" -t "${IMAGE_NAME}:${DEFAULT_TAG}" -f ./Containerfile .

      - name: Rechunk Image
        run: sudo podman run --rm --privileged -v /var/lib/containers:/var/lib/containers --entrypoint /usr/libexec/bootc-base-imagectl quay.io/centos-bootc/centos-bootc:stream10 rechunk --max-layers 67 "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" "localhost/${IMAGE_NAME}:${DEFAULT_TAG}"

      # The runner Podman is used for building so its Podman/crun versions
      # remain matched. Homebrew Podman is needed only when publishing because
      # the runner version does not preserve the rechunker's layer annotations.
      - name: Install Podman from Brew
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew update
          /home/linuxbrew/.linuxbrew/bin/brew install podman

          # Homebrew's current Podman expects a v2 registries.conf. The GitHub
          # runner image can still ship a v1 config.
          sudo mkdir -p /etc/containers
          printf 'unqualified-search-registries = ["docker.io"]\n' | sudo tee /etc/containers/registries.conf

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN_USER: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | sudo podman login -u "${LOGIN_USER}" --password-stdin "ghcr.io"
          echo "${GITHUB_TOKEN}" | docker login -u "${LOGIN_USER}" --password-stdin "ghcr.io" # For cosign

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          PLATFORM: ${{ matrix.platform }}
          MAX_RETRIES: 3
        run: |
          set -xeuo pipefail

          BREW_PODMAN="/home/linuxbrew/.linuxbrew/bin/podman"
          DIGEST_FILE="/tmp/digestfile"
          TARGET_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${PLATFORM}"

          push_image() {
            for i in $(seq "${MAX_RETRIES}"); do
              # The push runs under sudo, so Podman writes this file as root.
              # Remove it under sudo before each attempt; /tmp is sticky and
              # the runner user cannot unlink a root-owned digest file there.
              sudo rm -f "${DIGEST_FILE}"
              if sudo "${BREW_PODMAN}" push --digestfile="${DIGEST_FILE}" "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" "${TARGET_IMAGE}"; then
                if sudo test -s "${DIGEST_FILE}"; then
                  return 0
                fi
                echo "::error::Podman push succeeded but did not write ${DIGEST_FILE}"
                return 1
              fi
              sleep $((5 * i))
            done
            echo "::error::Podman push failed after ${MAX_RETRIES} attempts"
            return 1
          }

          # HACK: push a second time so layer annotations are present.
          # TODO: remove when https://github.com/containers/podman/issues/27796 is fixed in runners.
          push_image
          push_image

          REMOTE_IMAGE_DIGEST="$(sudo cat "${DIGEST_FILE}")"
          if [ -z "${REMOTE_IMAGE_DIGEST}" ]; then
            echo "::error::remote_image_digest is empty after push"
            exit 1
          fi

          echo "remote_image_digest=${REMOTE_IMAGE_DIGEST}" | tee -a "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Sign Image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REMOTE_IMAGE_DIGEST: ${{ steps.push.outputs.remote_image_digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${REMOTE_IMAGE_DIGEST}" ]; then
            echo "::error::REMOTE_IMAGE_DIGEST is empty; push step did not produce a digest"
            exit 1
          fi

          IMAGE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}@${REMOTE_IMAGE_DIGEST}"
          for attempt in 1 2 3; do
            if cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::Cosign signing attempt ${attempt} failed; retrying after transient Sigstore/Rekor error"
              sleep $((15 * attempt))
            fi
          done

          echo "::error::Cosign signing failed after 3 attempts for ${IMAGE_REF}"
          exit 1

      - name: Create Job Outputs
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.push.outputs.remote_image_digest }}
        run: |
          set -x
          mkdir -p /tmp/outputs/digests
          printf '%s,%s,%s\n' "${PLATFORM}" "${IMAGE_NAME}" "${DIGEST}" |
            tee "/tmp/outputs/digests/${IMAGE_NAME}-${PLATFORM}.csv"

      - name: Upload Output Artifacts
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/outputs/digests/*.csv

  manifest:
    name: Create Manifest
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build_push
    container:
      image: docker.io/library/alpine:latest
      options: --privileged --security-opt seccomp=unconfined
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install dependencies
        run: apk add bash coreutils curl docker findutils fuse-overlayfs git grep jq podman sed envsubst

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Exit on failure
        shell: bash
        env:
          JOBS: ${{ toJson(needs) }}
        run: |
          for i in $(jq -r 'to_entries[] | .value.result' <<< "${JOBS}"); do
            if [ "$i" != "success" ] && [ "$i" != "skipped" ]; then
              echo "Status check not okay!"
              exit 1
            fi
          done

        # This generates a timestamp like what is defined on the ArtifactHub documentation
        # E.G: 2022-02-08T15:38:15Z'
        # https://artifacthub.io/docs/topics/repositories/container-images/
        # https://linux.die.net/man/1/date
      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" | tee "${GITHUB_OUTPUT}"

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            containers.bootc=1
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}

      - name: Fetch Build Outputs
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ github.event.repository.name }}-*
          merge-multiple: true
          path: /tmp/artifacts

      - name: Load Outputs
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        id: load-outputs
        run: |
          set -x
          OUTCSV="$(mktemp)"
          for build_output in /tmp/artifacts/*.csv; do
            cat "${build_output}" >> "${OUTCSV}"
          done
          echo "OUTPUT_CSV=$(base32 -w 0 < "${OUTCSV}")" | tee -a "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REGISTRY: ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login -u "${{ github.actor }}" --password-stdin "${REGISTRY}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "${REGISTRY}"

      - name: Publish manifest with unified architecture and sign
        shell: bash
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          LABELS: ${{ steps.metadata.outputs.labels }}
          OUTPUT_CSV: ${{ steps.load-outputs.outputs.OUTPUT_CSV }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -x

          OUTPUT_CSV_FILE="$(mktemp)"
          echo "${OUTPUT_CSV}" | base32 -d | tee "${OUTPUT_CSV_FILE}"

          # This is insanely dumb, please PR if you have a better solution ~ @tulilirockz :3c
          IMAGES=$(cat "${OUTPUT_CSV_FILE}" | while IFS=$'\n' read -r ENTRY ; do echo "${ENTRY}" | cut -d, -f2 ; done | sort | uniq | tr "\n" " " | sed 's/.$//')
          for TARGET_IMAGE in ${IMAGES} ; do
            TARGET_MANIFEST="${IMAGE_REGISTRY}/${TARGET_IMAGE}"
            podman manifest create "${TARGET_MANIFEST}"

            PLATFORMS=$(grep -F -e "${TARGET_IMAGE}" "${OUTPUT_CSV_FILE}" | while IFS=$'\n' read -r ENTRY ; do echo "${ENTRY}" | cut -d, -f1 ; done | sort | uniq | tr "\n" " " | sed 's/.$//')
            for TARGET_PLATFORM in ${PLATFORMS} ; do
              TARGET_DIGEST="$(grep -F -e ",${TARGET_IMAGE}," "${OUTPUT_CSV_FILE}" | grep -F -e "${TARGET_PLATFORM}" | cut -d, -f3 | tr -d "\n")"
              podman manifest add "${TARGET_MANIFEST}" "${TARGET_MANIFEST}@${TARGET_DIGEST}" --arch "${TARGET_PLATFORM}"
            done

            while IFS= read -r LABEL; do
              podman manifest annotate --index --annotation "${LABEL}" "${TARGET_MANIFEST}"
            done <<< "${LABELS}"

            while IFS= read -r TAG; do
              podman manifest push --all=false --digestfile=/tmp/digestfile "${TARGET_MANIFEST}" "${TARGET_MANIFEST}:${TAG}"
            done <<< "${TAGS}"

          # HACK: push a second time so layer annotations are present
          # TODO: remove me when https://github.com/containers/podman/issues/27796 fixed
            while IFS= read -r TAG; do
              podman manifest push --all=false --digestfile=/tmp/digestfile "${TARGET_MANIFEST}" "${TARGET_MANIFEST}:${TAG}"
            done <<< "${TAGS}"

            MANIFEST_DIGEST="$(< /tmp/digestfile)"
            if [ -z "${MANIFEST_DIGEST}" ]; then
              echo "::error::manifest push did not produce a digest for ${TARGET_MANIFEST}; refusing to sign an empty reference"
              exit 1
            fi
            MANIFEST_REF="${TARGET_MANIFEST}@${MANIFEST_DIGEST}"
            for attempt in 1 2 3; do
              if cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${MANIFEST_REF}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "::error::Cosign signing failed after 3 attempts for ${MANIFEST_REF}"
                exit 1
              fi
              echo "::warning::Cosign signing attempt ${attempt} failed; retrying after transient Sigstore/Rekor error"
              sleep $((15 * attempt))
            done
          done
