---
name: Disk workflow checks

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-disk.yml
      - .github/workflows/check-disk.yml
      - tests/test_installer_workflow.py
      - Justfile
      - iso.toml
      - disk_config/disk.toml
  push:
    branches: [main]
    paths:
      - .github/workflows/build-disk.yml
      - .github/workflows/check-disk.yml
      - tests/test_installer_workflow.py
      - Justfile
      - iso.toml
      - disk_config/disk.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check installer workflow configuration
        run: python3 -m unittest discover -s tests -p 'test_installer_workflow.py' -v
